# Local run of the full stack: docker compose up --build
# Copy .env.example to .env and fill in the values first.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ems_db
      POSTGRES_USER: ${DB_USERNAME:-ems}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Plain-HTTP local run: the prod profile sets secure-only cookies, which
      # browsers will not send over http://localhost.
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/ems_db
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      GATEWAY_PORT: 8081
      EMS_BACKEND_URI: http://app:8080
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      EMS_MANAGEMENT_API_KEY: ${EMS_MANAGEMENT_API_KEY:?set EMS_MANAGEMENT_API_KEY in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EMS_RATE_LIMIT_ENABLED: ${EMS_RATE_LIMIT_ENABLED:-true}
      EMS_CORS_ALLOWED_ORIGINS: ${EMS_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/livez"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

volumes:
  pgdata:
  uploads:
  redisdata: