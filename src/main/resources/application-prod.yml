# Production. Every secret and connection value must come from the environment.
spring:
  jpa:
    show-sql: false

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        secure: true
        http-only: true
        same-site: lax

logging:
  level:
    root: INFO
    com.ems: INFO

ems:
  tracing:
    sampling:
      probability: ${EMS_TRACING_SAMPLING_PROBABILITY:0.05}

sentry:
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.05}
