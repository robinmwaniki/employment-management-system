# Shared configuration. Environment-specific values live in application-dev.yml
# and application-prod.yml; secrets are always supplied through environment variables.
spring:
  application:
    name: employee-management-system
  profiles:
    default: dev

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 20000
      max-lifetime: 1500000

  jpa:
    # Kept enabled until services are made @Transactional (data-layer phase);
    # templates and mappers currently rely on lazy loading during view rendering.
    open-in-view: true

  flyway:
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false

# Application settings (keys are unchanged from the original code base).
jwt:
  # Base64-encoded HMAC key, at least 256 bits. Required: there is no default.
  secret: ${JWT_SECRET}
  # Token lifetime in milliseconds.
  expiration: ${JWT_EXPIRATION_MS:3600000}

file:
  upload-dir: ${APP_UPLOAD_DIR:uploads}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}