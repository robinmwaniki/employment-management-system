<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Payroll Management')}"></head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="fw-bold">

                Payroll Management

            </h2>

            <a th:href="@{/payroll/new}"
               class="btn btn-primary">

                <i class="bi bi-plus-circle"></i>

                Generate Payroll

            </a>

        </div>

        <div class="card shadow border-0">

            <div class="card-header bg-primary text-white">

                <h5 class="mb-0">

                    Payroll Records

                </h5>

            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-dark">

                        <tr>

                            <th>ID</th>
                            <th>Employee</th>
                            <th>Month</th>
                            <th>Basic</th>
                            <th>House</th>
                            <th>Transport</th>
                            <th>Bonus</th>
                            <th>Deductions</th>
                            <th>Tax</th>
                            <th>Net Salary</th>
                            <th>Actions</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="payroll : ${payrolls.content}">

                            <td th:text="${payroll.id}"></td>

                            <td th:text="${payroll.employeeName}"></td>

                            <td th:text="${payroll.payrollMonth}"></td>

                            <td th:text="${payroll.basicSalary}"></td>

                            <td th:text="${payroll.houseAllowance}"></td>

                            <td th:text="${payroll.transportAllowance}"></td>

                            <td th:text="${payroll.bonus}"></td>

                            <td th:text="${payroll.deductions}"></td>

                            <td th:text="${payroll.tax}"></td>

                            <td>

                                <strong class="text-success"
                                        th:text="${payroll.netSalary}">

                                </strong>

                            </td>

                            <td>

                                <a th:href="@{/payroll/view/{id}(id=${payroll.id})}"
                                   class="btn btn-info btn-sm">

                                    View

                                </a>

                                <a th:href="@{/payroll/edit/{id}(id=${payroll.id})}"
                                   class="btn btn-warning btn-sm">

                                    Edit

                                </a>

                                <a th:href="@{/payroll/delete/{id}(id=${payroll.id})}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Delete this payroll record?');">

                                    Delete

                                </a>

                            </td>

                        </tr>

                        <tr th:if="${payrolls.content.isEmpty()}">

                            <td colspan="11"
                                class="text-center text-muted">

                                No payroll records found.

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <nav class="mt-4">

            <ul class="pagination justify-content-center">

                <li class="page-item"
                    th:classappend="${payrolls.first} ? 'disabled'">

                    <a class="page-link"
                       th:href="@{/payroll(page=${payrolls.number-1})}">

                        Previous

                    </a>

                </li>

                <li class="page-item disabled">

                    <span class="page-link">

                        Page
                        <span th:text="${payrolls.number+1}"></span>

                        of

                        <span th:text="${payrolls.totalPages}"></span>

                    </span>

                </li>

                <li class="page-item"
                    th:classappend="${payrolls.last} ? 'disabled'">

                    <a class="page-link"
                       th:href="@{/payroll(page=${payrolls.number+1})}">

                        Next

                    </a>

                </li>

            </ul>

        </nav>

    </div>

</div>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</body>

</html>
