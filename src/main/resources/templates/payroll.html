<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Payroll Management')}"></head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="page">

        <div class="page-header">

            <div>
                <h1 class="page-title">Payroll Management</h1>
                <p class="page-subtitle">Monthly payroll records for all employees.</p>
            </div>

            <a th:href="@{/payroll/new}"
               class="btn btn-primary">
                <i class="bi bi-plus-lg"></i>
                Generate Payroll
            </a>

        </div>

        <div class="card">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Employee</th>
                        <th>Month</th>
                        <th>Basic</th>
                        <th>House</th>
                        <th>Transport</th>
                        <th>Bonus</th>
                        <th>Deductions</th>
                        <th>Tax</th>
                        <th>Net Salary</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="payroll : ${payrolls.content}">

                        <td th:text="${payroll.id}"></td>

                        <td class="fw-semibold" th:text="${payroll.employeeName}"></td>

                        <td th:text="${payroll.payrollMonth}"></td>

                        <td th:text="${#numbers.formatDecimal(payroll.basicSalary, 1, 'COMMA', 2, 'POINT')}"></td>

                        <td th:text="${#numbers.formatDecimal(payroll.houseAllowance, 1, 'COMMA', 2, 'POINT')}"></td>

                        <td th:text="${#numbers.formatDecimal(payroll.transportAllowance, 1, 'COMMA', 2, 'POINT')}"></td>

                        <td th:text="${#numbers.formatDecimal(payroll.bonus, 1, 'COMMA', 2, 'POINT')}"></td>

                        <td th:text="${#numbers.formatDecimal(payroll.deductions, 1, 'COMMA', 2, 'POINT')}"></td>

                        <td th:text="${#numbers.formatDecimal(payroll.tax, 1, 'COMMA', 2, 'POINT')}"></td>

                        <td>
                            <strong class="text-success"
                                    th:text="${#numbers.formatDecimal(payroll.netSalary, 1, 'COMMA', 2, 'POINT')}"></strong>
                        </td>

                        <td>

                            <div class="row-actions">

                                <a th:href="@{/payroll/view/{id}(id=${payroll.id})}"
                                   class="btn btn-info btn-sm">
                                    <i class="bi bi-eye"></i>
                                    View
                                </a>

                                <a th:href="@{/payroll/edit/{id}(id=${payroll.id})}"
                                   class="btn btn-warning btn-sm">
                                    <i class="bi bi-pencil-square"></i>
                                    Edit
                                </a>

                                <form th:action="@{/payroll/delete/{id}(id=${payroll.id})}"
                                      method="post"
                                      onsubmit="return confirm('Delete this payroll record?');">
                                    <button type="submit" class="btn btn-danger btn-sm">
                                        <i class="bi bi-trash"></i>
                                        Delete
                                    </button>
                                </form>

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <div class="empty-state"
                 th:if="${payrolls.content.isEmpty()}">
                <i class="bi bi-cash-stack"></i>
                No payroll records found.
            </div>

        </div>

        <nav class="pager" th:if="${payrolls.totalPages > 1}">

            <ul class="pagination justify-content-center mb-0">

                <li class="page-item"
                    th:classappend="${payrolls.first} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/payroll(page=${payrolls.number-1})}">Previous</a>
                </li>

                <li class="page-item disabled">
                    <span class="page-link">
                        Page
                        <span th:text="${payrolls.number+1}">1</span>
                        of
                        <span th:text="${payrolls.totalPages}">1</span>
                    </span>
                </li>

                <li class="page-item"
                    th:classappend="${payrolls.last} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/payroll(page=${payrolls.number+1})}">Next</a>
                </li>

            </ul>

        </nav>

    </div>

</div>

</body>

</html>
