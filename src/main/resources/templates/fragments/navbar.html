<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<header th:fragment="navbar" class="topbar">

    <button type="button"
            id="sidebarToggle"
            class="topbar-toggle d-lg-none"
            aria-label="Toggle navigation">
        <i class="bi bi-list"></i>
    </button>

    <span class="topbar-title d-none d-sm-inline">
        Employee Management System
    </span>

    <div class="topbar-actions">

        <a class="icon-btn"
           th:href="@{/notifications}"
           aria-label="Notifications">

            <i class="bi bi-bell"></i>

            <span class="icon-badge"
                  th:if="${unreadCount != null and unreadCount > 0}"
                  th:text="${unreadCount}">0</span>

        </a>

        <a class="user-chip" th:href="@{/profile}">

            <span class="avatar avatar-sm"
                  th:text="${currentUsername != null and !currentUsername.isEmpty() ? currentUsername.substring(0,1).toUpperCase() : 'U'}">U</span>

            <span class="d-none d-md-inline"
                  th:text="${currentUsername}">admin</span>

        </a>

    </div>

</header>

</body>

</html>
