<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Employee Report')}"></head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">

  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="container-fluid mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

      <h2 class="fw-bold">

        Employee Report

      </h2>

      <div>

        <button class="btn btn-danger">

          Export PDF

        </button>

        <button class="btn btn-success">

          Export Excel

        </button>

        <button onclick="window.print()"
                class="btn btn-primary">

          Print

        </button>

      </div>

    </div>

    <div class="card shadow">

      <div class="card-body">

        <div class="table-responsive">

          <table class="table table-striped table-hover">

            <thead class="table-dark">

            <tr>

              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Department</th>
              <th>Salary</th>
              <th>Hire Date</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="employee : ${employees.content}">

              <td th:text="${employee.id}"></td>

              <td th:text="${employee.firstName + ' ' + employee.lastName}"></td>

              <td th:text="${employee.email}"></td>

              <td th:text="${employee.phoneNumber}"></td>

              <td th:text="${employee.departmentName}"></td>

              <td th:text="${employee.salary}"></td>

              <td th:text="${employee.hireDate}"></td>

            </tr>

            <tr th:if="${employees.content.isEmpty()}">

              <td colspan="7"
                  class="text-center">

                No employees found.

              </td>

            </tr>

            </tbody>

          </table>

        </div>

      </div>

    </div>

    <nav class="mt-4">

      <ul class="pagination justify-content-center">

        <li class="page-item"
            th:classappend="${employees.first} ? 'disabled'">

          <a class="page-link"
             th:href="@{/reports/employees(page=${employees.number-1},size=${employees.size})}">

            Previous

          </a>

        </li>

        <li class="page-item disabled">

                    <span class="page-link">

                        Page
                        <span th:text="${employees.number+1}"></span>
                        of
                        <span th:text="${employees.totalPages}"></span>

                    </span>

        </li>

        <li class="page-item"
            th:classappend="${employees.last} ? 'disabled'">

          <a class="page-link"
             th:href="@{/reports/employees(page=${employees.number+1},size=${employees.size})}">

            Next

          </a>

        </li>

      </ul>

    </nav>

  </div>

</div>

</body>

</html>
