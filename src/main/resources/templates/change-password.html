<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Change Password')}"></head>

<body>

<div th:replace="~{fragments/employee-sidebar :: sidebar}"></div>

<div class="content">

  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="container mt-4">

    <div class="card shadow">

      <div class="card-header bg-primary text-white">

        <h4>Change Password</h4>

      </div>

      <div class="card-body">

        <form th:action="@{/employee/change-password}"
              method="post">

          <div class="mb-3">

            <label>Current Password</label>

            <input
                    type="password"
                    name="currentPassword"
                    class="form-control"
                    required>

          </div>

          <div class="mb-3">

            <label>New Password</label>

            <input
                    type="password"
                    name="newPassword"
                    class="form-control"
                    required>

          </div>

          <div class="mb-3">

            <label>Confirm Password</label>

            <input
                    type="password"
                    name="confirmPassword"
                    class="form-control"
                    required>

          </div>

          <button class="btn btn-success">

            Update Password

          </button>

        </form>

      </div>

    </div>

  </div>

</div>

</body>

</html>
