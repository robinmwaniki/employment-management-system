<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Change Password')}"></head>

<body>

<div th:replace="~{fragments/employee-sidebar :: sidebar}"></div>

<div class="content">

  <div th:replace="~{fragments/employee-navbar :: navbar}"></div>

  <div class="page">

    <div class="page-header">

      <div>
        <h1 class="page-title">Change Password</h1>
        <p class="page-subtitle">Choose a strong password you don't use elsewhere.</p>
      </div>

    </div>

    <div class="card form-card">

      <div class="card-body p-4">

        <div class="alert alert-success"
             th:if="${success}"
             th:text="${success}"></div>

        <form th:action="@{/employee/change-password}"
              th:object="${passwordForm}"
              method="post">

          <div class="mb-3">

            <label for="currentPassword" class="form-label">Current Password</label>

            <input type="password"
                   id="currentPassword"
                   th:field="*{currentPassword}"
                   class="form-control"
                   autocomplete="current-password"
                   required>

            <div class="text-danger small mt-1"
                 th:if="${#fields.hasErrors('currentPassword')}"
                 th:errors="*{currentPassword}"></div>

          </div>

          <div class="mb-3">

            <label for="newPassword" class="form-label">New Password</label>

            <input type="password"
                   id="newPassword"
                   th:field="*{newPassword}"
                   class="form-control"
                   autocomplete="new-password"
                   required>

            <div class="form-text">
              At least 10 characters, with a letter and a digit.
            </div>

            <div class="text-danger small mt-1"
                 th:if="${#fields.hasErrors('newPassword')}"
                 th:errors="*{newPassword}"></div>

          </div>

          <div class="mb-4">

            <label for="confirmPassword" class="form-label">Confirm Password</label>

            <input type="password"
                   id="confirmPassword"
                   th:field="*{confirmPassword}"
                   class="form-control"
                   autocomplete="new-password"
                   required>

            <div class="text-danger small mt-1"
                 th:if="${#fields.hasErrors('confirmPassword')}"
                 th:errors="*{confirmPassword}"></div>

          </div>

          <button type="submit" class="btn btn-primary">
            <i class="bi bi-shield-check"></i>
            Update Password
          </button>

        </form>

      </div>

    </div>

  </div>

</div>

</body>

</html>
