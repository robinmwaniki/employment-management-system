<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Add Employee')}"></head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid mt-4">

        <div class="card shadow">

            <div class="card-header">

                <h3>Add Employee</h3>

            </div>

            <div class="card-body">

                <form
                        th:action="${employeeId != null}
        ? @{/employees/update/{id}(id=${employeeId})}
        : @{/employees/save}"
                        th:object="${employee}"
                        method="post">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label>First Name</label>

                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{firstName}"
                                    required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>Last Name</label>

                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{lastName}"
                                    required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>Email</label>

                            <input
                                    type="email"
                                    class="form-control"
                                    th:field="*{email}"
                                    required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>Phone Number</label>

                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{phoneNumber}"
                                    required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>Salary</label>

                            <input
                                    type="number"
                                    step="0.01"
                                    class="form-control"
                                    th:field="*{salary}"
                                    required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>Hire Date</label>

                            <input
                                    type="date"
                                    class="form-control"
                                    th:field="*{hireDate}"
                                    required>

                        </div>

                        <div class="col-md-12 mb-3">

                            <label>Department</label>

                            <select
                                    class="form-select"
                                    th:field="*{departmentId}"
                                    required>

                                <option value="">Select Department</option>

                                <option
                                        th:each="department : ${departments}"
                                        th:value="${department.id}"
                                        th:text="${department.name}">
                                </option>

                            </select>

                        </div>

                    </div>

                    <button
                            type="submit"
                            class="btn btn-success">

                        Save Employee

                    </button>

                    <a
                            th:href="@{/employees}"
                            class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
