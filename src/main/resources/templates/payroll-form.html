<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Payroll')}"></head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h4 class="mb-0"
                    th:text="${payrollId != null}
    ? 'Edit Payroll'
    : 'Generate Payroll'">
                </h4>

            </div>

            <div class="card-body">

                <form
                        th:action="${payrollId != null}
? @{/payroll/update/{id}(id=${payrollId})}
: @{/payroll/save}"

                        th:object="${payroll}"

                        method="post">

                    <div class="mb-3">

                        <label class="form-label">

                            Employee

                        </label>

                        <select
                                class="form-select"

                                th:field="*{employeeId}"

                                required>

                            <option value="">
                                Select Employee
                            </option>

                            <option
                                    th:each="employee : ${employees}"

                                    th:value="${employee.id}"

                                    th:text="${employee.firstName+' '+employee.lastName}">

                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label>

                            Payroll Month

                        </label>

                        <input

                                type="month"

                                class="form-control"

                                th:field="*{payrollMonth}"

                                required>

                    </div>

                    <div class="row">

                        <div class="col-md-6">

                            <label>

                                House Allowance

                            </label>

                            <input

                                    type="number"

                                    step="0.01"

                                    class="form-control"

                                    th:field="*{houseAllowance}">

                        </div>

                        <div class="col-md-6">

                            <label>

                                Transport Allowance

                            </label>

                            <input

                                    type="number"

                                    step="0.01"

                                    class="form-control"

                                    th:field="*{transportAllowance}">

                        </div>

                    </div>

                    <br>

                    <div class="row">

                        <div class="col-md-4">

                            <label>

                                Bonus

                            </label>

                            <input

                                    type="number"

                                    step="0.01"

                                    class="form-control"

                                    th:field="*{bonus}">

                        </div>

                        <div class="col-md-4">

                            <label>

                                Deductions

                            </label>

                            <input

                                    type="number"

                                    step="0.01"

                                    class="form-control"

                                    th:field="*{deductions}">

                        </div>

                        <div class="col-md-4">

                            <label>

                                Tax

                            </label>

                            <input

                                    type="number"

                                    step="0.01"

                                    class="form-control"

                                    th:field="*{tax}">

                        </div>

                    </div>

                    <br>

                    <button
                            class="btn btn-success">

                        Save Payroll

                    </button>

                    <a
                            th:href="@{/payroll}"

                            class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
