<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('System Users')}"></head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="page">

        <div class="page-header">

            <div>
                <h1 class="page-title">System Users</h1>
                <p class="page-subtitle">Manage who can sign in and what they can do.</p>
            </div>

            <a th:href="@{/users/new}"
               class="btn btn-primary">
                <i class="bi bi-person-plus"></i>
                Create User
            </a>

        </div>

        <div class="card">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Employee</th>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="user : ${users.content}">

                        <td th:text="${user.id}"></td>

                        <td th:text="${user.employeeName}"></td>

                        <td class="fw-semibold" th:text="${user.username}"></td>

                        <td>
                            <span class="badge"
                                  th:classappend="${#strings.contains(user.role, 'ADMIN')} ? 'bg-primary' : (${#strings.contains(user.role, 'HR')} ? 'bg-info' : 'bg-secondary')"
                                  th:text="${#strings.replace(user.role, 'ROLE_', '')}"></span>
                        </td>

                        <td>

                            <span th:if="${user.enabled}"
                                  class="badge bg-success">Enabled</span>

                            <span th:unless="${user.enabled}"
                                  class="badge bg-danger">Disabled</span>

                        </td>

                        <td>

                            <div class="row-actions">

                                <a th:href="@{/users/edit/{id}(id=${user.id})}"
                                   class="btn btn-warning btn-sm">
                                    <i class="bi bi-pencil-square"></i>
                                    Edit
                                </a>

                                <form th:if="${user.enabled}"
                                      th:action="@{/users/disable/{id}(id=${user.id})}"
                                      method="post">
                                    <button type="submit" class="btn btn-secondary btn-sm">
                                        <i class="bi bi-slash-circle"></i>
                                        Disable
                                    </button>
                                </form>

                                <form th:unless="${user.enabled}"
                                      th:action="@{/users/enable/{id}(id=${user.id})}"
                                      method="post">
                                    <button type="submit" class="btn btn-success btn-sm">
                                        <i class="bi bi-check-circle"></i>
                                        Enable
                                    </button>
                                </form>

                                <form th:action="@{/users/delete/{id}(id=${user.id})}"
                                      method="post"
                                      onsubmit="return confirm('Delete this user account?');">
                                    <button type="submit" class="btn btn-danger btn-sm">
                                        <i class="bi bi-trash"></i>
                                        Delete
                                    </button>
                                </form>

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <div class="empty-state"
                 th:if="${users.content.isEmpty()}">
                <i class="bi bi-person-x"></i>
                No user accounts found.
            </div>

        </div>

        <div th:replace="~{fragments/pager :: pager(${users}, '/users')}"></div>

    </div>

</div>

</body>

</html>
