<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Announcements')}"></head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="page">

        <div class="page-header">

            <div>
                <h1 class="page-title">Company Announcements</h1>
                <p class="page-subtitle">Share news and updates with every employee.</p>
            </div>

            <a th:href="@{/announcements/new}"
               class="btn btn-primary">
                <i class="bi bi-plus-lg"></i>
                New Announcement
            </a>

        </div>

        <div class="card">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Publish Date</th>
                        <th>Expiry Date</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="announcement : ${announcements.content}">

                        <td th:text="${announcement.id}"></td>

                        <td class="fw-semibold" th:text="${announcement.title}"></td>

                        <td th:text="${announcement.publishDate}"></td>

                        <td th:text="${announcement.expiryDate}"></td>

                        <td>

                            <div class="row-actions">

                                <a th:href="@{/announcements/edit/{id}(id=${announcement.id})}"
                                   class="btn btn-warning btn-sm">
                                    <i class="bi bi-pencil-square"></i>
                                    Edit
                                </a>

                                <form th:action="@{/announcements/delete/{id}(id=${announcement.id})}"
                                      method="post"
                                      onsubmit="return confirm('Delete this announcement?');">
                                    <button type="submit" class="btn btn-danger btn-sm">
                                        <i class="bi bi-trash"></i>
                                        Delete
                                    </button>
                                </form>

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <div class="empty-state"
                 th:if="${announcements.content.isEmpty()}">
                <i class="bi bi-megaphone"></i>
                No announcements yet.
            </div>

        </div>

        <div th:replace="~{fragments/pager :: pager(${announcements}, '/announcements')}"></div>

    </div>

</div>

</body>

</html>
