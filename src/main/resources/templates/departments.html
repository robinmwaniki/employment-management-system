<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Departments')}"></head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="fw-bold">Departments</h2>

            <a th:href="@{/departments/new}"
               class="btn btn-primary">

                <i class="bi bi-plus-circle"></i>
                Add Department

            </a>

        </div>

        <div class="card shadow border-0">

            <div class="card-header bg-primary text-white">

                <h5 class="mb-0">

                    Department List

                </h5>

            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-dark">

                        <tr>

                            <th>ID</th>
                            <th>Name</th>
                            <th>Actions</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="department : ${departments}">

                            <td th:text="${department.id}"></td>

                            <td th:text="${department.name}"></td>

                            <td>

                                <a th:href="@{/departments/edit/{id}(id=${department.id})}"
                                   class="btn btn-warning btn-sm">

                                    <i class="bi bi-pencil-square"></i>

                                </a>

                                <a th:href="@{/departments/delete/{id}(id=${department.id})}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Delete this department?');">

                                    <i class="bi bi-trash"></i>

                                </a>

                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(departments)}">

                            <td colspan="3"
                                class="text-center text-muted">

                                No departments found.

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</body>

</html>
