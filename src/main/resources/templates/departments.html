<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Departments')}"></head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="page">

        <div class="page-header">

            <div>
                <h1 class="page-title">Departments</h1>
                <p class="page-subtitle">Organise your company into teams.</p>
            </div>

            <a th:href="@{/departments/new}"
               class="btn btn-primary">
                <i class="bi bi-plus-lg"></i>
                Add Department
            </a>

        </div>

        <div class="card">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="department : ${departments}">

                        <td th:text="${department.id}"></td>

                        <td class="fw-semibold" th:text="${department.name}"></td>

                        <td>

                            <div class="row-actions">

                                <a th:href="@{/departments/edit/{id}(id=${department.id})}"
                                   class="btn btn-warning btn-sm"
                                   title="Edit">
                                    <i class="bi bi-pencil-square"></i>
                                </a>

                                <form th:action="@{/departments/delete/{id}(id=${department.id})}"
                                      method="post"
                                      onsubmit="return confirm('Delete this department?');">
                                    <button type="submit"
                                            class="btn btn-danger btn-sm"
                                            title="Delete">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <div class="empty-state"
                 th:if="${#lists.isEmpty(departments)}">
                <i class="bi bi-building"></i>
                No departments found.
            </div>

        </div>

    </div>

</div>

</body>

</html>
