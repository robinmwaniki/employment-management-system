<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Leave Report')}"></head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="fw-bold">

                Leave Report

            </h2>

            <div>

                <button class="btn btn-danger">

                    Export PDF

                </button>

                <button class="btn btn-success">

                    Export Excel

                </button>

                <button
                        onclick="window.print()"
                        class="btn btn-primary">

                    Print

                </button>

            </div>

        </div>

        <div class="card shadow">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-striped table-hover">

                        <thead class="table-dark">

                        <tr>

                            <th>ID</th>
                            <th>Employee</th>
                            <th>Leave Type</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Status</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="leave : ${leaves.content}">

                            <td th:text="${leave.id}"></td>

                            <td th:text="${leave.employeeName}"></td>

                            <td th:text="${leave.leaveType}"></td>

                            <td th:text="${leave.startDate}"></td>

                            <td th:text="${leave.endDate}"></td>

                            <td>

                                <span
                                        th:if="${leave.status.name() == 'PENDING'}"
                                        class="badge bg-warning text-dark">

                                    Pending

                                </span>

                                <span
                                        th:if="${leave.status.name() == 'APPROVED'}"
                                        class="badge bg-success">

                                    Approved

                                </span>

                                <span
                                        th:if="${leave.status.name() == 'REJECTED'}"
                                        class="badge bg-danger">

                                    Rejected

                                </span>

                                <span
                                        th:if="${leave.status.name() == 'CANCELLED'}"
                                        class="badge bg-secondary">

                                    Cancelled

                                </span>

                            </td>

                        </tr>

                        <tr th:if="${leaves.content.isEmpty()}">

                            <td colspan="6"
                                class="text-center">

                                No leave records found.

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <nav class="mt-4">

            <ul class="pagination justify-content-center">

                <li class="page-item"
                    th:classappend="${leaves.first}? 'disabled'">

                    <a class="page-link"
                       th:href="@{/reports/leaves(page=${leaves.number-1},size=${leaves.size})}">

                        Previous

                    </a>

                </li>

                <li class="page-item disabled">

                    <span class="page-link">

                        Page
                        <span th:text="${leaves.number+1}"></span>
                        of
                        <span th:text="${leaves.totalPages}"></span>

                    </span>

                </li>

                <li class="page-item"
                    th:classappend="${leaves.last}? 'disabled'">

                    <a class="page-link"
                       th:href="@{/reports/leaves(page=${leaves.number+1},size=${leaves.size})}">

                        Next

                    </a>

                </li>

            </ul>

        </nav>

    </div>

</div>

</body>

</html>
