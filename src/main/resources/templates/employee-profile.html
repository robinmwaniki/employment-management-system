<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('My Profile')}"></head>

<body>

<div th:replace="~{fragments/employee-sidebar :: sidebar}"></div>

<div class="content">

    <div th:replace="~{fragments/employee-navbar :: navbar}"></div>

    <div class="page">

        <div class="page-header">

            <div>
                <h1 class="page-title">My Profile</h1>
                <p class="page-subtitle">Your details as held by HR.</p>
            </div>

            <a class="btn btn-primary"
               th:href="@{/employee/profile/edit}">
                <i class="bi bi-pencil-square"></i>
                Edit Profile
            </a>

        </div>

        <div class="alert alert-success"
             th:if="${success}"
             th:text="${success}"></div>

        <div class="alert alert-danger"
             th:if="${error}"
             th:text="${error}"></div>

        <div class="row g-4">

            <div class="col-lg-4">

                <div class="card">

                    <div class="card-body text-center p-4">

                        <img th:if="${employee.profilePhoto != null and !employee.profilePhoto.isEmpty()}"
                             th:src="@{/photos/employee/{id}(id=${employee.id},v=${employee.profilePhoto})}"
                             class="profile-photo"
                             alt="Profile photo">

                        <span th:unless="${employee.profilePhoto != null and !employee.profilePhoto.isEmpty()}"
                              class="profile-photo profile-photo-initials"
                              th:text="${employee.firstName != null and !employee.firstName.isEmpty() ? employee.firstName.substring(0,1).toUpperCase() : '?'}">?</span>

                        <h5 class="mt-3 mb-0"
                            th:text="${employee.firstName + ' ' + employee.lastName}">Name</h5>

                        <p class="text-muted"
                           th:text="${employee.departmentName}">Department</p>

                        <form th:action="@{/employee/profile/photo}"
                              method="post"
                              enctype="multipart/form-data"
                              class="mt-3">

                            <input type="file"
                                   name="file"
                                   class="form-control form-control-sm mb-2"
                                   accept="image/jpeg,image/png,image/webp"
                                   required>

                            <button type="submit"
                                    class="btn btn-outline-primary btn-sm w-100">
                                <i class="bi bi-camera"></i>
                                Update photo
                            </button>

                            <div class="form-text mt-2">JPEG, PNG or WebP, up to 2 MB.</div>

                        </form>

                    </div>

                </div>

            </div>

            <div class="col-lg-8">

                <div class="card">

                    <div class="card-header">Personal details</div>

                    <div class="card-body">

                        <dl class="detail-list">

                            <div class="row">
                                <dt class="col-sm-4">First name</dt>
                                <dd class="col-sm-8" th:text="${employee.firstName}"></dd>
                            </div>

                            <div class="row">
                                <dt class="col-sm-4">Last name</dt>
                                <dd class="col-sm-8" th:text="${employee.lastName}"></dd>
                            </div>

                            <div class="row">
                                <dt class="col-sm-4">Email</dt>
                                <dd class="col-sm-8" th:text="${employee.email}"></dd>
                            </div>

                            <div class="row">
                                <dt class="col-sm-4">Phone</dt>
                                <dd class="col-sm-8" th:text="${employee.phoneNumber}"></dd>
                            </div>

                            <div class="row">
                                <dt class="col-sm-4">Department</dt>
                                <dd class="col-sm-8" th:text="${employee.departmentName}"></dd>
                            </div>

                            <div class="row">
                                <dt class="col-sm-4">Salary</dt>
                                <dd class="col-sm-8" th:text="${employee.salary}"></dd>
                            </div>

                            <div class="row">
                                <dt class="col-sm-4">Hire date</dt>
                                <dd class="col-sm-8" th:text="${employee.hireDate}"></dd>
                            </div>

                        </dl>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
