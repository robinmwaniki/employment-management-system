<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('My Profile')}"></head>

<body>

<div th:replace="~{fragments/employee-sidebar :: sidebar}"></div>

<div class="content">

    <div th:replace="~{fragments/employee-navbar :: navbar}"></div>

    <div class="container mt-4">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h4>

                    My Profile

                </h4>

            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-4 text-center">

                        <img

                                th:if="${employee.profilePhoto != null}"

                                th:src="@{/uploads/{photo}(photo=${employee.profilePhoto})}"

                                class="rounded-circle"

                                width="180"

                                height="180">

                        <img

                                th:if="${employee.profilePhoto == null}"

                                th:src="@{/images/default-user.png}"

                                class="rounded-circle"

                                width="180"

                                height="180">

                    </div>

                    <div class="col-md-8">

                        <table class="table">

                            <tr>

                                <th>Employee ID</th>

                                <td th:text="${employee.id}"></td>

                            </tr>

                            <tr>

                                <th>Name</th>

                                <td th:text="${employee.firstName+' '+employee.lastName}"></td>

                            </tr>

                            <tr>

                                <th>Email</th>

                                <td th:text="${employee.email}"></td>

                            </tr>

                            <tr>

                                <th>Phone</th>

                                <td th:text="${employee.phoneNumber}"></td>

                            </tr>

                            <tr>

                                <th>Department</th>

                                <td th:text="${employee.departmentName}"></td>

                            </tr>

                            <tr>

                                <th>Salary</th>

                                <td th:text="${employee.salary}"></td>

                            </tr>

                        </table>
                        <div class="mt-3">

                            <a th:href="@{/employee/profile/edit}"
                               class="btn btn-primary">

                                Edit Profile

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
