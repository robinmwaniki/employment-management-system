<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('My Profile')}"></head>

<body>

<div th:replace="~{fragments/employee-sidebar :: sidebar}"></div>

<div class="content">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h3>My Profile</h3>

            </div>

            <div class="card-body text-center">

                <img th:src="@{/api/employees/photo/{id}(id=${employee.id})}"
                     width="160"
                     height="160"
                     class="rounded-circle border">

                <hr>

                <table class="table table-bordered">

                    <tr>
                        <th>First Name</th>
                        <td th:text="${employee.firstName}"></td>
                    </tr>

                    <tr>
                        <th>Last Name</th>
                        <td th:text="${employee.lastName}"></td>
                    </tr>

                    <tr>
                        <th>Email</th>
                        <td th:text="${employee.email}"></td>
                    </tr>

                    <tr>
                        <th>Phone</th>
                        <td th:text="${employee.phoneNumber}"></td>
                    </tr>

                    <tr>
                        <th>Department</th>
                        <td th:text="${employee.departmentName}"></td>
                    </tr>

                    <tr>
                        <th>Salary</th>
                        <td th:text="${employee.salary}"></td>
                    </tr>

                    <tr>
                        <th>Hire Date</th>
                        <td th:text="${employee.hireDate}"></td>
                    </tr>

                </table>

                <a class="btn btn-primary"
                   th:href="@{/employee/profile/edit}">

                    Edit Profile

                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
