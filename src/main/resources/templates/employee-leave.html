<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('My Leave')}"></head>

<body>

<div th:replace="~{fragments/employee-sidebar :: sidebar}"></div>

<div class="content">

    <div th:replace="~{fragments/employee-navbar :: navbar}"></div>

    <div class="page">

        <div class="page-header">

            <div>
                <h1 class="page-title">My Leave Requests</h1>
                <p class="page-subtitle">Track your requests and apply for time off.</p>
            </div>

            <a class="btn btn-primary"
               th:href="@{/employee/leave/apply}">
                <i class="bi bi-plus-lg"></i>
                Apply Leave
            </a>

        </div>

        <div class="card">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">
                    <tr>
                        <th>Type</th>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Reason</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="leave : ${leaves.content}">

                        <td class="fw-semibold" th:text="${leave.leaveType}"></td>

                        <td th:text="${leave.startDate}"></td>

                        <td th:text="${leave.endDate}"></td>

                        <td th:text="${leave.reason}"></td>

                        <td>

                            <span class="badge bg-warning"
                                  th:if="${leave.status.name()=='PENDING'}">Pending</span>

                            <span class="badge bg-success"
                                  th:if="${leave.status.name()=='APPROVED'}">Approved</span>

                            <span class="badge bg-danger"
                                  th:if="${leave.status.name()=='REJECTED'}">Rejected</span>

                            <span class="badge bg-secondary"
                                  th:if="${leave.status.name()=='CANCELLED'}">Cancelled</span>

                        </td>

                        <td>

                            <form th:if="${leave.status.name()=='PENDING'}"
                                  th:action="@{/employee/leave/cancel/{id}(id=${leave.id})}"
                                  method="post"
                                  onsubmit="return confirm('Cancel this leave request?');">
                                <button type="submit" class="btn btn-danger btn-sm">
                                    <i class="bi bi-x-circle"></i>
                                    Cancel
                                </button>
                            </form>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <div class="empty-state"
                 th:if="${#lists.isEmpty(leaves.content)}">
                <i class="bi bi-airplane"></i>
                No leave requests found.
            </div>

        </div>

        <div th:replace="~{fragments/pager :: pager(${leaves}, '/employee/leave')}"></div>

    </div>

</div>

</body>

</html>
