<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('My Leave')}"></head>

<body>

<div th:replace="~{fragments/employee-sidebar :: sidebar}"></div>

<div class="content">

    <div th:replace="~{fragments/employee-navbar :: navbar}"></div>

    <div class="container-fluid mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="fw-bold">

                My Leave Requests

            </h2>

            <a class="btn btn-primary"
               th:href="@{/employee/leave/apply}">

                <i class="bi bi-plus-circle"></i>

                Apply Leave

            </a>

        </div>

        <div class="card shadow">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover">

                        <thead class="table-dark">

                        <tr>

                            <th>Type</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th>Action</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="leave : ${leaves.content}">

                            <td th:text="${leave.leaveType}"></td>

                            <td th:text="${leave.startDate}"></td>

                            <td th:text="${leave.endDate}"></td>

                            <td th:text="${leave.reason}"></td>

                            <td>

                                <span
                                        class="badge bg-warning"
                                        th:if="${leave.status.name()=='PENDING'}">

                                    Pending

                                </span>

                                <span
                                        class="badge bg-success"
                                        th:if="${leave.status.name()=='APPROVED'}">

                                    Approved

                                </span>

                                <span
                                        class="badge bg-danger"
                                        th:if="${leave.status.name()=='REJECTED'}">

                                    Rejected

                                </span>

                                <span
                                        class="badge bg-secondary"
                                        th:if="${leave.status.name()=='CANCELLED'}">

                                    Cancelled

                                </span>

                            </td>

                            <td>

                                <a
                                        th:if="${leave.status.name()=='PENDING'}"
                                        th:href="@{/leave/cancel/{id}(id=${leave.id})}"
                                        class="btn btn-danger btn-sm">

                                    Cancel

                                </a>

                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(leaves.content)}">

                            <td colspan="6"
                                class="text-center">

                                No leave requests found.

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</body>

</html>
