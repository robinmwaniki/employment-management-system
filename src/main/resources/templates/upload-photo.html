<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Upload Employee Photo')}"></head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="page">

        <div class="page-header">

            <div>
                <h1 class="page-title">Employee Photo</h1>
                <p class="page-subtitle">JPEG, PNG or WebP, up to 2 MB.</p>
            </div>

        </div>

        <div class="card form-card">

            <div class="card-body p-4">

                <div class="alert alert-danger"
                     th:if="${error}"
                     th:text="${error}"></div>

                <form th:action="@{/employees/photo/{id}(id=${employeeId})}"
                      method="post"
                      enctype="multipart/form-data">

                    <div class="mb-4">

                        <label class="form-label" for="file">Select photo</label>

                        <input type="file"
                               id="file"
                               name="file"
                               class="form-control"
                               accept="image/jpeg,image/png,image/webp"
                               required>

                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-upload"></i>
                        Upload
                    </button>

                    <a th:href="@{/employees}"
                       class="btn btn-outline-primary">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
