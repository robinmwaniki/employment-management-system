<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Employees')}"></head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="page">

        <div class="page-header">

            <div>
                <h1 class="page-title">Employees</h1>
                <p class="page-subtitle">Everyone who works at the company.</p>
            </div>

            <div class="d-flex flex-wrap gap-2">

                <form class="d-flex gap-2"
                      th:action="@{/employees}"
                      method="get">

                    <input class="form-control"
                           type="search"
                           name="keyword"
                           th:value="${keyword}"
                           placeholder="Search employee...">

                    <button class="btn btn-outline-primary" type="submit">
                        <i class="bi bi-search"></i>
                    </button>

                </form>

                <a th:href="@{/employees/new}"
                   class="btn btn-primary">
                    <i class="bi bi-person-plus-fill"></i>
                    Add Employee
                </a>

            </div>

        </div>

        <div class="card">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">
                    <tr>
                        <th>Employee</th>
                        <th>Phone</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="employee : ${employees.content}">

                        <td>

                            <div class="d-flex align-items-center gap-3">

                                <img th:if="${employee.profilePhoto != null and !employee.profilePhoto.isEmpty()}"
                                     th:src="@{/uploads/{photo}(photo=${employee.profilePhoto})}"
                                     class="avatar"
                                     alt="">

                                <span th:unless="${employee.profilePhoto != null and !employee.profilePhoto.isEmpty()}"
                                      class="avatar"
                                      th:text="${employee.firstName != null and !employee.firstName.isEmpty() ? employee.firstName.substring(0,1).toUpperCase() : '?'}">?</span>

                                <div>
                                    <div class="fw-semibold"
                                         th:text="${employee.firstName + ' ' + employee.lastName}">Name</div>
                                    <div class="text-muted small"
                                         th:text="${employee.email}">email</div>
                                </div>

                            </div>

                        </td>

                        <td th:text="${employee.phoneNumber}"></td>

                        <td>
                            <span class="badge bg-primary"
                                  th:if="${employee.departmentName != null}"
                                  th:text="${employee.departmentName}"></span>
                        </td>

                        <td th:text="${employee.salary}"></td>

                        <td>

                            <div class="row-actions">

                                <a th:href="@{/employees/edit/{id}(id=${employee.id})}"
                                   class="btn btn-warning btn-sm"
                                   title="Edit">
                                    <i class="bi bi-pencil-square"></i>
                                </a>

                                <a th:href="@{/employees/photo/{id}(id=${employee.id})}"
                                   class="btn btn-info btn-sm"
                                   title="Upload Photo">
                                    <i class="bi bi-camera-fill"></i>
                                </a>

                                <form th:action="@{/employees/delete/{id}(id=${employee.id})}"
                                      method="post"
                                      onsubmit="return confirm('Are you sure you want to delete this employee?');">
                                    <button type="submit"
                                            class="btn btn-danger btn-sm"
                                            title="Delete">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <div class="empty-state"
                 th:if="${employees.content.isEmpty()}">
                <i class="bi bi-people"></i>
                No employees found.
            </div>

        </div>

        <nav class="pager" th:if="${employees.totalPages > 1}">

            <ul class="pagination justify-content-center mb-0">

                <li class="page-item"
                    th:classappend="${employees.first} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/employees(page=${employees.number-1},keyword=${keyword})}">Previous</a>
                </li>

                <li class="page-item disabled">
                    <span class="page-link">
                        Page
                        <span th:text="${employees.number + 1}">1</span>
                        of
                        <span th:text="${employees.totalPages}">1</span>
                    </span>
                </li>

                <li class="page-item"
                    th:classappend="${employees.last} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/employees(page=${employees.number+1},keyword=${keyword})}">Next</a>
                </li>

            </ul>

        </nav>

    </div>

</div>

</body>

</html>
