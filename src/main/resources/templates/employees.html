<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Employees')}"></head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">

    <div th:replace="~{fragments/employee-navbar :: navbar}"></div>

    <div class="container-fluid mt-4">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center flex-wrap mb-4">

            <h2 class="fw-bold">
                Employees
            </h2>

            <form class="d-flex"
                  th:action="@{/employees}"
                  method="get">

                <input
                        class="form-control me-2"
                        type="search"
                        name="keyword"
                        th:value="${keyword}"
                        placeholder="Search employee...">

                <button class="btn btn-outline-primary">
                    <i class="bi bi-search"></i>
                    Search
                </button>

            </form>

            <a th:href="@{/employees/new}"
               class="btn btn-primary">

                <i class="bi bi-person-plus-fill"></i>
                Add Employee

            </a>

        </div>

        <!-- Employee Table -->

        <div class="card shadow border-0">

            <div class="card-header bg-primary text-white">

                <h5 class="mb-0">

                    Employee List

                </h5>

            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-dark">

                        <tr>

                            <th>ID</th>

                            <th>Photo</th>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Phone</th>

                            <th>Department</th>

                            <th>Salary</th>

                            <th width="220">Actions</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="employee : ${employees.content}">

                            <td th:text="${employee.id}"></td>

                            <td>

                                <img
                                        th:src="${employee.profilePhoto != null && !employee.profilePhoto.isEmpty()}
                                        ? @{/uploads/{photo}(photo=${employee.profilePhoto})}
                                        : @{/images/default-user.png}"
                                        width="55"
                                        height="55"
                                        class="rounded-circle border shadow-sm"
                                        style="object-fit: cover;">

                            </td>

                            <td>

                                <strong
                                        th:text="${employee.firstName + ' ' + employee.lastName}">
                                </strong>

                            </td>

                            <td th:text="${employee.email}"></td>

                            <td th:text="${employee.phoneNumber}"></td>

                            <td th:text="${employee.departmentName}"></td>

                            <td th:text="${employee.salary}"></td>

                            <td>

                                <!-- Edit -->

                                <a th:href="@{/employees/edit/{id}(id=${employee.id})}"
                                   class="btn btn-warning btn-sm"
                                   title="Edit">

                                    <i class="bi bi-pencil-square"></i>

                                </a>

                                <!-- Upload Photo -->

                                <a th:href="@{/employees/photo/{id}(id=${employee.id})}"
                                   class="btn btn-info btn-sm text-white"
                                   title="Upload Photo">

                                    <i class="bi bi-camera-fill"></i>

                                </a>

                                <!-- Delete -->

                                <a th:href="@{/employees/delete/{id}(id=${employee.id})}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Are you sure you want to delete this employee?');"
                                   title="Delete">

                                    <i class="bi bi-trash"></i>

                                </a>

                            </td>

                        </tr>

                        <tr th:if="${employees.content.isEmpty()}">

                            <td colspan="8"
                                class="text-center text-muted py-4">

                                No employees found.

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <!-- Pagination -->

        <nav class="mt-4">

            <ul class="pagination justify-content-center">

                <li class="page-item"
                    th:classappend="${employees.first} ? 'disabled'">

                    <a class="page-link"
                       th:href="@{/employees(page=${employees.number-1},keyword=${keyword})}">

                        Previous

                    </a>

                </li>

                <li class="page-item disabled">

                    <span class="page-link">

                        Page
                        <span th:text="${employees.number + 1}"></span>

                        of

                        <span th:text="${employees.totalPages}"></span>

                    </span>

                </li>

                <li class="page-item"
                    th:classappend="${employees.last} ? 'disabled'">

                    <a class="page-link"
                       th:href="@{/employees(page=${employees.number+1},keyword=${keyword})}">

                        Next

                    </a>

                </li>

            </ul>

        </nav>

    </div>

</div>

<!-- Bootstrap Icons -->

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</body>

</html>
