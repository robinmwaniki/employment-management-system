<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Edit Profile')}"></head>

<body>

<div th:replace="~{fragments/employee-sidebar :: sidebar}"></div>

<div class="content">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">

        <div class="card shadow">

            <div class="card-header bg-success text-white">

                <h3>Edit Profile</h3>

            </div>

            <div class="card-body">

                <form
                        th:action="@{/employee/profile/update}"
                        th:object="${employee}"
                        method="post">

                    <input type="hidden"
                           th:field="*{departmentId}"/>

                    <input type="hidden"
                           th:field="*{hireDate}"/>

                    <input type="hidden"
                           th:field="*{salary}"/>

                    <div class="mb-3">

                        <label>First Name</label>

                        <input
                                class="form-control"
                                th:field="*{firstName}">

                    </div>

                    <div class="mb-3">

                        <label>Last Name</label>

                        <input
                                class="form-control"
                                th:field="*{lastName}">

                    </div>

                    <div class="mb-3">

                        <label>Email</label>

                        <input
                                class="form-control"
                                th:field="*{email}">

                    </div>

                    <div class="mb-3">

                        <label>Phone</label>

                        <input
                                class="form-control"
                                th:field="*{phoneNumber}">

                    </div>

                    <button class="btn btn-success">

                        Save Changes

                    </button>

                    <a class="btn btn-secondary"
                       th:href="@{/employee/profile}">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
