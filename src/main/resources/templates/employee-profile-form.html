<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Edit Profile')}"></head>

<body>

<div th:replace="~{fragments/employee-sidebar :: sidebar}"></div>

<div class="content">

    <div th:replace="~{fragments/employee-navbar :: navbar}"></div>

    <div class="page">

        <div class="page-header">

            <div>
                <h1 class="page-title">Edit Profile</h1>
                <p class="page-subtitle">
                    You can update your name and contact details. Salary, department and
                    hire date are managed by HR.
                </p>
            </div>

        </div>

        <div class="card form-card">

            <div class="card-body p-4">

                <form th:action="@{/employee/profile/update}"
                      th:object="${profileForm}"
                      method="post">

                    <div class="mb-3">

                        <label class="form-label" for="firstName">First name</label>

                        <input id="firstName"
                               class="form-control"
                               th:field="*{firstName}"
                               required>

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('firstName')}"
                             th:errors="*{firstName}"></div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label" for="lastName">Last name</label>

                        <input id="lastName"
                               class="form-control"
                               th:field="*{lastName}"
                               required>

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('lastName')}"
                             th:errors="*{lastName}"></div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label" for="email">Email</label>

                        <input id="email"
                               type="email"
                               class="form-control"
                               th:field="*{email}"
                               required>

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}"></div>

                    </div>

                    <div class="mb-4">

                        <label class="form-label" for="phoneNumber">Phone</label>

                        <input id="phoneNumber"
                               class="form-control"
                               th:field="*{phoneNumber}"
                               required>

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('phoneNumber')}"
                             th:errors="*{phoneNumber}"></div>

                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i>
                        Save Changes
                    </button>

                    <a class="btn btn-outline-primary"
                       th:href="@{/employee/profile}">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
