<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Notifications')}"></head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="page">

        <div class="page-header">

            <div>
                <h1 class="page-title">Notifications</h1>
                <p class="page-subtitle">
                    <span th:text="${unreadCount}">0</span> unread
                </p>
            </div>

            <form th:action="@{/notifications/read-all}" method="post">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check2-all"></i>
                    Mark All Read
                </button>
            </form>

        </div>

        <div class="card">

            <div class="empty-state"
                 th:if="${#lists.isEmpty(notifications)}">
                <i class="bi bi-bell-slash"></i>
                No notifications available.
            </div>

            <div th:unless="${#lists.isEmpty(notifications)}">

                <div class="notice"
                     th:each="notification : ${notifications}"
                     th:classappend="${!notification.read} ? 'is-unread'">

                    <div>

                        <h5 class="notice-title">
                            <span th:text="${notification.title}"></span>
                            <span class="badge bg-danger ms-2"
                                  th:if="${!notification.read}">New</span>
                        </h5>

                        <p class="mb-1"
                           th:text="${notification.message}"></p>

                        <span class="notice-time"
                              th:text="${#temporals.format(notification.createdAt,'dd MMM yyyy HH:mm')}"></span>

                    </div>

                    <form th:if="${!notification.read}"
                          th:action="@{/notifications/read/{id}(id=${notification.id})}"
                          method="post">
                        <button type="submit" class="btn btn-outline-primary btn-sm">
                            Mark Read
                        </button>
                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
