spring:
  application:
    name: ems-api-gateway
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  cloud:
    gateway:
      server:
        webflux:
          # The gateway owns browser CORS. Deduplicate legacy backend CORS headers,
          # keeping the gateway's first, environment-validated values.
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin Access-Control-Allow-Methods Access-Control-Allow-Headers Access-Control-Expose-Headers, RETAIN_FIRST
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/api/**]':
                allowedOrigins: ${ems.gateway.cors.allowed-origins}
                allowedMethods: ${ems.gateway.cors.allowed-methods}
                allowedHeaders: ${ems.gateway.cors.allowed-headers}
                exposedHeaders: ${ems.gateway.cors.exposed-headers}
                allowCredentials: false
                maxAge: ${ems.gateway.cors.max-age}
          routes:
            - id: ems-auth-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/auth/**
            - id: ems-employees-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/employees/**
            - id: ems-departments-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/departments/**
            - id: ems-attendance-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/attendance/**
            - id: ems-leaves-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/leaves/**
            - id: ems-payroll-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/payroll/**
            - id: ems-payslips-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/payslips/**
            - id: ems-reports-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/reports/**
            - id: ems-performance-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/performance/**
            - id: ems-announcements-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/announcements/**
            - id: ems-notifications-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/notifications/**
            - id: ems-dashboard-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/dashboard/**
            - id: ems-users-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/users/**
            - id: ems-self-service-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/me/**
            - id: ems-system-logs-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/system-logs/**

server:
  port: ${GATEWAY_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# The gateway and backend must receive the same environment-provided signing key.
ems:
  backend:
    uri: ${EMS_BACKEND_URI:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET}
  gateway:
    cors:
      # Comma-separated exact origins; wildcard origins and credentials are disabled.
      allowed-origins: ${EMS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
      allowed-methods: ${EMS_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
      allowed-headers: ${EMS_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,X-Correlation-ID}
      exposed-headers: ${EMS_CORS_EXPOSED_HEADERS:Authorization,X-Correlation-ID,X-RateLimit-Limit,X-RateLimit-Remaining,Retry-After}
      max-age: ${EMS_CORS_MAX_AGE:3600}
    rate-limit:
      enabled: ${EMS_RATE_LIMIT_ENABLED:true}
      trusted-proxy-cidrs: ${EMS_TRUSTED_PROXY_CIDRS:}
      retry-after-seconds: ${EMS_RATE_LIMIT_RETRY_AFTER_SECONDS:5}
      login:
        replenish-rate: ${EMS_RATE_LIMIT_LOGIN_PER_SECOND:2}
        burst-capacity: ${EMS_RATE_LIMIT_LOGIN_BURST:5}
        requested-tokens: ${EMS_RATE_LIMIT_LOGIN_TOKENS:1}
      registration:
        replenish-rate: ${EMS_RATE_LIMIT_REGISTRATION_PER_SECOND:1}
        burst-capacity: ${EMS_RATE_LIMIT_REGISTRATION_BURST:2}
        requested-tokens: ${EMS_RATE_LIMIT_REGISTRATION_TOKENS:1}
      general:
        replenish-rate: ${EMS_RATE_LIMIT_GENERAL_PER_SECOND:20}
        burst-capacity: ${EMS_RATE_LIMIT_GENERAL_BURST:40}
        requested-tokens: ${EMS_RATE_LIMIT_GENERAL_TOKENS:1}
      reports:
        replenish-rate: ${EMS_RATE_LIMIT_REPORTS_PER_SECOND:2}
        burst-capacity: ${EMS_RATE_LIMIT_REPORTS_BURST:4}
        requested-tokens: ${EMS_RATE_LIMIT_REPORTS_TOKENS:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

