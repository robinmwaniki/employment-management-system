server:
  port: ${GATEWAY_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# The gateway and backend must receive the same environment-provided signing key.
ems:
  backend:
    uri: ${EMS_BACKEND_URI:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET}
  gateway:
    tracing:
      enabled: ${EMS_TRACING_ENABLED:true}
    cors:
      # Comma-separated exact origins; wildcard origins and credentials are disabled.
      allowed-origins: ${EMS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
      allowed-methods: ${EMS_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
      allowed-headers: ${EMS_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,X-Correlation-ID}
      exposed-headers: ${EMS_CORS_EXPOSED_HEADERS:Authorization,X-Correlation-ID,X-RateLimit-Limit,X-RateLimit-Remaining,Retry-After}
      max-age: ${EMS_CORS_MAX_AGE:3600}
    rate-limit:
      enabled: ${EMS_RATE_LIMIT_ENABLED:true}
      trusted-proxy-cidrs: ${EMS_TRUSTED_PROXY_CIDRS:}
      retry-after-seconds: ${EMS_RATE_LIMIT_RETRY_AFTER_SECONDS:5}
      login:
        replenish-rate: ${EMS_RATE_LIMIT_LOGIN_PER_SECOND:2}
        burst-capacity: ${EMS_RATE_LIMIT_LOGIN_BURST:5}
        requested-tokens: ${EMS_RATE_LIMIT_LOGIN_TOKENS:1}
      registration:
        replenish-rate: ${EMS_RATE_LIMIT_REGISTRATION_PER_SECOND:1}
        burst-capacity: ${EMS_RATE_LIMIT_REGISTRATION_BURST:2}
        requested-tokens: ${EMS_RATE_LIMIT_REGISTRATION_TOKENS:1}
      general:
        replenish-rate: ${EMS_RATE_LIMIT_GENERAL_PER_SECOND:20}
        burst-capacity: ${EMS_RATE_LIMIT_GENERAL_BURST:40}
        requested-tokens: ${EMS_RATE_LIMIT_GENERAL_TOKENS:1}
      reports:
        replenish-rate: ${EMS_RATE_LIMIT_REPORTS_PER_SECOND:2}
        burst-capacity: ${EMS_RATE_LIMIT_REPORTS_BURST:4}
        requested-tokens: ${EMS_RATE_LIMIT_REPORTS_TOKENS:1}

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${EMS_GATEWAY_CB_WINDOW_SIZE:20}
        minimum-number-of-calls: ${EMS_GATEWAY_CB_MIN_CALLS:10}
        permitted-number-of-calls-in-half-open-state: ${EMS_GATEWAY_CB_HALF_OPEN_CALLS:3}
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: ${EMS_GATEWAY_CB_OPEN_WAIT:10s}
        failure-rate-threshold: ${EMS_GATEWAY_CB_FAILURE_THRESHOLD:50}
        slow-call-duration-threshold: ${EMS_GATEWAY_CB_SLOW_CALL_DURATION:2s}
        slow-call-rate-threshold: ${EMS_GATEWAY_CB_SLOW_CALL_THRESHOLD:50}
    instances:
      emsAuthCircuitBreaker:
        base-config: default
      emsDemoCircuitBreaker:
        base-config: default
      emsEmployeesCircuitBreaker:
        base-config: default
      emsDepartmentsCircuitBreaker:
        base-config: default
      emsAttendanceCircuitBreaker:
        base-config: default
      emsLeavesCircuitBreaker:
        base-config: default
      emsPayrollCircuitBreaker:
        base-config: default
      emsPayslipsCircuitBreaker:
        base-config: default
      emsReportsCircuitBreaker:
        base-config: default
      emsPerformanceCircuitBreaker:
        base-config: default
      emsAnnouncementsCircuitBreaker:
        base-config: default
      emsNotificationsCircuitBreaker:
        base-config: default
      emsDashboardCircuitBreaker:
        base-config: default
      emsCompanyProfileCircuitBreaker:
        base-config: default
      emsUsersCircuitBreaker:
        base-config: default
      emsSelfServiceCircuitBreaker:
        base-config: default
      emsSystemLogsCircuitBreaker:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: ${EMS_GATEWAY_CB_TIMEOUT:15s}
        cancel-running-future: true
    instances:
      emsCompanyProfileCircuitBreaker:
        base-config: default
      emsAuthCircuitBreaker:
        base-config: default
      emsDemoCircuitBreaker:
        base-config: default
      emsEmployeesCircuitBreaker:
        base-config: default
      emsDepartmentsCircuitBreaker:
        base-config: default
      emsAttendanceCircuitBreaker:
        base-config: default
      emsLeavesCircuitBreaker:
        base-config: default
      emsPayrollCircuitBreaker:
        base-config: default
      emsPayslipsCircuitBreaker:
        base-config: default
      emsReportsCircuitBreaker:
        base-config: default
      emsPerformanceCircuitBreaker:
        base-config: default
      emsAnnouncementsCircuitBreaker:
        base-config: default
      emsNotificationsCircuitBreaker:
        base-config: default
      emsDashboardCircuitBreaker:
        base-config: default
      emsUsersCircuitBreaker:
        base-config: default
      emsSelfServiceCircuitBreaker:
        base-config: default
      emsSystemLogsCircuitBreaker:
        base-config: default

management:
  tracing:
    sampling:
      probability: ${EMS_TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: W3C
    baggage:
      enabled: false
    export:
      otlp:
        enabled: ${EMS_TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    enabled: ${EMS_TRACING_ENABLED:true}
    resource-attributes:
      service.name: ${OTEL_SERVICE_NAME:ems-api-gateway}
      service.namespace: employee-management-system
      deployment.environment: ${EMS_ENVIRONMENT:local}
    tracing:
      sampler: ${EMS_TRACING_SAMPLER:parent-based-trace-id-ratio}
      limits:
        max-attributes: 64
        max-attribute-value-length: 128
      export:
        otlp:
          timeout: ${EMS_TRACING_EXPORT_TIMEOUT:10s}
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      enabled: true
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          # Redis is required for distributed rate limiting; backend health is
          # deliberately excluded so downstream outages do not affect liveness.
          include: readinessState,redis
      show-details: never
      show-components: never
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        ems.gateway.request.duration: true
      percentiles:
        ems.gateway.request.duration: [0.5, 0.95, 0.99]
  health:
    circuitbreakers:
      enabled: true

# Sentry auto-configuration is activated only when SENTRY_DSN is supplied.
# Do not define a default DSN: local/test environments stay disconnected by default.
sentry:
  environment: ${EMS_ENVIRONMENT:local}
  send-default-pii: false
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}

info:
  app:
    name: EMS API Gateway
    status: IN PROGRESS
