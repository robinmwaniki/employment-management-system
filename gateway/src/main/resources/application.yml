spring:
  application:
    name: ems-api-gateway
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  cloud:
    gateway:
      server:
        webflux:
          # The gateway owns browser CORS. Deduplicate legacy backend CORS headers,
          # keeping the gateway's first, environment-validated values.
          httpclient:
            connect-timeout: ${EMS_GATEWAY_CONNECT_TIMEOUT_MS:1000}
            response-timeout: ${EMS_GATEWAY_RESPONSE_TIMEOUT:5s}
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin Access-Control-Allow-Methods Access-Control-Allow-Headers Access-Control-Expose-Headers, RETAIN_FIRST
            # Retries are restricted to safe methods and transient upstream failures.
            - name: Retry
              args:
                retries: ${EMS_GATEWAY_SAFE_RETRIES:2}
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                  - HEAD
                exceptions:
                  - java.io.IOException
                  - java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: ${EMS_GATEWAY_RETRY_FIRST_BACKOFF:100ms}
                  maxBackoff: ${EMS_GATEWAY_RETRY_MAX_BACKOFF:500ms}
                  factor: 2
                  basedOnPreviousValue: false
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/api/**]':
                allowedOrigins: ${ems.gateway.cors.allowed-origins}
                allowedMethods: ${ems.gateway.cors.allowed-methods}
                allowedHeaders: ${ems.gateway.cors.allowed-headers}
                exposedHeaders: ${ems.gateway.cors.exposed-headers}
                allowCredentials: false
                maxAge: ${ems.gateway.cors.max-age}
          httpclient:
            connect-timeout: ${EMS_GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${EMS_GATEWAY_DEFAULT_RESPONSE_TIMEOUT:5s}
          routes:
            - id: ems-auth-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/auth/**
              metadata:
                response-timeout: ${EMS_GATEWAY_AUTH_RESPONSE_TIMEOUT_MS:4000}
              filters:
                - name: Retry
                  args:
                    retries: ${EMS_GATEWAY_RETRY_MAX_ATTEMPTS:2}
                    statuses:
                      - BAD_GATEWAY
                      - SERVICE_UNAVAILABLE
                      - GATEWAY_TIMEOUT
                    methods:
                      - GET
                      - HEAD
                      - OPTIONS
                    exceptions:
                      - java.io.IOException
                      - java.util.concurrent.TimeoutException
                    backoff:
                      firstBackoff: ${EMS_GATEWAY_RETRY_FIRST_BACKOFF:50ms}
                      maxBackoff: ${EMS_GATEWAY_RETRY_MAX_BACKOFF:250ms}
                      factor: 2
                      basedOnPreviousValue: false
                - name: CircuitBreaker
                  args:
                    name: emsAuthApiCircuitBreaker
                    fallbackUri: forward:/gateway/fallback
                    statusCodes:
                      - BAD_GATEWAY
                      - SERVICE_UNAVAILABLE
                      - GATEWAY_TIMEOUT
              metadata:
                connect-timeout: ${EMS_GATEWAY_CONNECT_TIMEOUT_MS:1000}
                response-timeout: ${EMS_AUTH_RESPONSE_TIMEOUT_MS:3000}
              filters:
                - name: CircuitBreaker
                  args:
                    name: emsAuth
                    fallbackUri: forward:/internal/fallback/ems
                    statusCodes:
                      - BAD_GATEWAY
                      - SERVICE_UNAVAILABLE
                      - GATEWAY_TIMEOUT
            - id: ems-employees-api
