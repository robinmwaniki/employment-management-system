spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  application:
    name: ems-api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          # The gateway owns browser CORS. Deduplicate legacy backend CORS headers,
          # keeping the gateway's first, environment-validated values.
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin Access-Control-Allow-Methods Access-Control-Allow-Headers Access-Control-Expose-Headers, RETAIN_FIRST
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/api/**]':
                allowedOrigins: ${ems.gateway.cors.allowed-origins}
                allowedMethods: ${ems.gateway.cors.allowed-methods}
                allowedHeaders: ${ems.gateway.cors.allowed-headers}
                exposedHeaders: ${ems.gateway.cors.exposed-headers}
                allowCredentials: false
                maxAge: ${ems.gateway.cors.max-age}
          routes:
            # Login has a stricter per-client policy in addition to the general API quota.
            - id: ems-login-api
              order: -20
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/auth/login
                - Method=POST
            # Registration has a separate, deliberately conservative quota.
            - id: ems-registration-api
              order: -19
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/auth/register
                - Method=POST
            # Expensive report endpoints have a dedicated lower throughput quota.
            - id: ems-reports-api
              order: -18
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/reports/**
            - id: ems-auth-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/auth/**
            - id: ems-employees-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/employees/**
            - id: ems-departments-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/departments/**
            - id: ems-attendance-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/attendance/**
            - id: ems-leaves-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/leaves/**
            - id: ems-payroll-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/payroll/**
            - id: ems-payslips-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/payslips/**
            - id: ems-performance-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/performance/**
            - id: ems-announcements-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/announcements/**
            - id: ems-notifications-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/notifications/**
            - id: ems-dashboard-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/dashboard/**
            - id: ems-users-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/users/**
            - id: ems-self-service-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/me/**
            - id: ems-system-logs-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/system-logs/**

server:
  port: ${GATEWAY_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# The gateway and backend must receive the same environment-provided signing key.
ems:
  backend:
    uri: ${EMS_BACKEND_URI:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET}
  gateway:
    cors:
      # Comma-separated exact origins; wildcard origins and credentials are disabled.
      allowed-origins: ${EMS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
      allowed-methods: ${EMS_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
      allowed-headers: ${EMS_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,X-Correlation-ID}
      exposed-headers: ${EMS_CORS_EXPOSED_HEADERS:Authorization,X-Correlation-ID}
      max-age: ${EMS_CORS_MAX_AGE:3600}
    rate-limit:
      # Forwarded client IP headers are trusted only when the immediate peer
      # belongs to one of these explicitly configured CIDR ranges.
      trusted-proxy-cidrs: ${EMS_TRUSTED_PROXY_CIDRS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

