spring:
  application:
    name: ems-api-gateway
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  cloud:
    gateway:
      server:
        webflux:
          # The gateway owns browser CORS. Deduplicate legacy backend CORS headers,
          # keeping the gateway's first, environment-validated values.
          httpclient:
            connect-timeout: ${EMS_GATEWAY_CONNECT_TIMEOUT_MS:1000}
            response-timeout: ${EMS_GATEWAY_RESPONSE_TIMEOUT:5s}
          metrics:
            enabled: true
            tags:
              path:
                enabled: false
          observability:
            enabled: true
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin Access-Control-Allow-Methods Access-Control-Allow-Headers Access-Control-Expose-Headers, RETAIN_FIRST
            # Reject oversized payloads before they reach the EMS backend.
            - name: RequestSize
              args:
                maxSize: ${EMS_GATEWAY_MAX_REQUEST_SIZE:10MB}
            # Retry only idempotent reads after transient upstream failures.
            - name: Retry
              args:
                retries: ${EMS_GATEWAY_SAFE_RETRIES:2}
                statuses:
                  - INTERNAL_SERVER_ERROR
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                  - HEAD
                exceptions:
                  - java.io.IOException
                  - java.util.concurrent.TimeoutException
                  - io.netty.handler.timeout.ReadTimeoutException
                backoff:
                  firstBackoff: ${EMS_GATEWAY_RETRY_FIRST_BACKOFF:100ms}
                  maxBackoff: ${EMS_GATEWAY_RETRY_MAX_BACKOFF:500ms}
                  factor: 2
                  basedOnPreviousValue: false
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/api/**]':
                allowedOrigins: ${ems.gateway.cors.allowed-origins}
                allowedMethods: ${ems.gateway.cors.allowed-methods}
                allowedHeaders: ${ems.gateway.cors.allowed-headers}
                exposedHeaders: ${ems.gateway.cors.exposed-headers}
                allowCredentials: false
                maxAge: ${ems.gateway.cors.max-age}
          routes:
            - id: ems-auth-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/auth/**
              metadata:
                connect-timeout: ${EMS_GATEWAY_CONNECT_TIMEOUT_MS:1000}
                response-timeout: ${EMS_GATEWAY_AUTH_RESPONSE_TIMEOUT_MS:3000}
              filters:
                - name: CircuitBreaker
                  args:
                    name: emsAuthCircuitBreaker
                    fallbackUri: forward:/gateway/fallback
                    statusCodes:
                      - INTERNAL_SERVER_ERROR
                      - BAD_GATEWAY
                      - SERVICE_UNAVAILABLE
                      - GATEWAY_TIMEOUT
            - id: ems-demo-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/demo/**
              metadata:
                connect-timeout: ${EMS_GATEWAY_CONNECT_TIMEOUT_MS:1000}
                response-timeout: ${EMS_GATEWAY_DEMO_RESPONSE_TIMEOUT_MS:3000}
              filters:
                - name: CircuitBreaker
                  args:
                    name: emsDemoCircuitBreaker
                    fallbackUri: forward:/gateway/fallback
                    statusCodes:
                      - INTERNAL_SERVER_ERROR
                      - BAD_GATEWAY
                      - SERVICE_UNAVAILABLE
                      - GATEWAY_TIMEOUT
            - id: ems-employees-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/employees/**
              metadata:
                connect-timeout: ${EMS_GATEWAY_CONNECT_TIMEOUT_MS:1000}
                response-timeout: ${EMS_GATEWAY_EMPLOYEES_RESPONSE_TIMEOUT_MS:4000}
              filters:
                - name: CircuitBreaker
                  args:
                    name: emsEmployeesCircuitBreaker
                    fallbackUri: forward:/gateway/fallback
                    statusCodes:
                      - BAD_GATEWAY
                      - SERVICE_UNAVAILABLE
                      - GATEWAY_TIMEOUT
            - id: ems-departments-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/departments/**
              metadata:
                connect-timeout: ${EMS_GATEWAY_CONNECT_TIMEOUT_MS:1000}
                response-timeout: ${EMS_GATEWAY_DEPARTMENTS_RESPONSE_TIMEOUT_MS:3000}
              filters:
                - name: CircuitBreaker
                  args:
                    name: emsDepartmentsCircuitBreaker
                    fallbackUri: forward:/gateway/fallback
                    statusCodes:
                      - BAD_GATEWAY
                      - SERVICE_UNAVAILABLE
                      - GATEWAY_TIMEOUT
            - id: ems-attendance-api
              uri: ${ems.backend.uri}
              predicates:
