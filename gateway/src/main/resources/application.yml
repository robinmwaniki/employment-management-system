spring:
  application:
    name: ems-api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_FIRST
          routes:
            - id: ems-auth-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/auth/**
            - id: ems-employees-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/employees/**
            - id: ems-departments-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/departments/**
            - id: ems-attendance-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/attendance/**
            - id: ems-leaves-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/leaves/**
            - id: ems-payroll-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/payroll/**
            - id: ems-payslips-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/payslips/**
            - id: ems-reports-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/reports/**
            - id: ems-performance-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/performance/**
            - id: ems-announcements-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/announcements/**
            - id: ems-notifications-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/notifications/**
            - id: ems-dashboard-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/dashboard/**
            - id: ems-users-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/users/**
            - id: ems-self-service-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/me/**
            - id: ems-system-logs-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/system-logs/**

          # Gateway owns browser CORS; dedupe legacy backend headers after routing.
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins: ${EMS_CORS_ALLOWED_ORIGINS:http://localhost:3000}
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: [Authorization, Content-Type, Accept, X-Correlation-ID]
                exposedHeaders: [X-Correlation-ID]
                allowCredentials: true
                maxAge: 3600

server:
  port: ${GATEWAY_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# The gateway and backend must receive the same environment-provided signing key.
ems:
  backend:
    uri: ${EMS_BACKEND_URI:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

