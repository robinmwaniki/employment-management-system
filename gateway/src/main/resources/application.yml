spring:
  application:
    name: ems-api-gateway
  main:
    web-application-type: reactive

server:
  port: ${GATEWAY_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
