spring:
  application:
    name: ems-api-gateway
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  cloud:
    gateway:
      server:
        webflux:
          # The gateway owns browser CORS. Deduplicate legacy backend CORS headers,
          # keeping the gateway's first, environment-validated values.
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin Access-Control-Allow-Methods Access-Control-Allow-Headers Access-Control-Expose-Headers, RETAIN_FIRST
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/api/**]':
                allowedOrigins: ${ems.gateway.cors.allowed-origins}
                allowedMethods: ${ems.gateway.cors.allowed-methods}
                allowedHeaders: ${ems.gateway.cors.allowed-headers}
                exposedHeaders: ${ems.gateway.cors.exposed-headers}
                allowCredentials: false
                maxAge: ${ems.gateway.cors.max-age}
          filter:
            request-rate-limiter:
              deny-empty-key: true
              empty-key-status-code: TOO_MANY_REQUESTS
          routes:
            - id: ems-auth-login
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/auth/login
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@trustedClientAddressKeyResolver}"
                    redis-rate-limiter.replenishRate: ${ems.gateway.rate-limit.login.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${ems.gateway.rate-limit.login.burst-capacity}
                    redis-rate-limiter.requestedTokens: ${ems.gateway.rate-limit.login.requested-tokens}
            - id: ems-auth-register
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/auth/register
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@trustedClientAddressKeyResolver}"
                    redis-rate-limiter.replenishRate: ${ems.gateway.rate-limit.registration.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${ems.gateway.rate-limit.registration.burst-capacity}
                    redis-rate-limiter.requestedTokens: ${ems.gateway.rate-limit.registration.requested-tokens}
            - id: ems-auth-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@trustedClientAddressKeyResolver}"
                    redis-rate-limiter.replenishRate: ${ems.gateway.rate-limit.general.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${ems.gateway.rate-limit.general.burst-capacity}
                    redis-rate-limiter.requestedTokens: ${ems.gateway.rate-limit.general.requested-tokens}
            - id: ems-employees-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/employees/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@trustedClientAddressKeyResolver}"
                    redis-rate-limiter.replenishRate: ${ems.gateway.rate-limit.general.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${ems.gateway.rate-limit.general.burst-capacity}
                    redis-rate-limiter.requestedTokens: ${ems.gateway.rate-limit.general.requested-tokens}
            - id: ems-departments-api
              uri: ${ems.backend.uri}
              predicates:
                - Path=/api/departments/**
