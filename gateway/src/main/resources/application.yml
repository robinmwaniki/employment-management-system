server:
  port: ${GATEWAY_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# The gateway and backend must receive the same environment-provided signing key.
ems:
  backend:
    uri: ${EMS_BACKEND_URI:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET}
  gateway:
    cors:
      # Comma-separated exact origins; wildcard origins and credentials are disabled.
      allowed-origins: ${EMS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
      allowed-methods: ${EMS_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
      allowed-headers: ${EMS_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,X-Correlation-ID}
      exposed-headers: ${EMS_CORS_EXPOSED_HEADERS:Authorization,X-Correlation-ID,X-RateLimit-Limit,X-RateLimit-Remaining,Retry-After}
      max-age: ${EMS_CORS_MAX_AGE:3600}
    rate-limit:
      enabled: ${EMS_RATE_LIMIT_ENABLED:true}
      trusted-proxy-cidrs: ${EMS_TRUSTED_PROXY_CIDRS:}
      retry-after-seconds: ${EMS_RATE_LIMIT_RETRY_AFTER_SECONDS:5}
      login:
        replenish-rate: ${EMS_RATE_LIMIT_LOGIN_PER_SECOND:2}
        burst-capacity: ${EMS_RATE_LIMIT_LOGIN_BURST:5}
        requested-tokens: ${EMS_RATE_LIMIT_LOGIN_TOKENS:1}
      registration:
        replenish-rate: ${EMS_RATE_LIMIT_REGISTRATION_PER_SECOND:1}
        burst-capacity: ${EMS_RATE_LIMIT_REGISTRATION_BURST:2}
        requested-tokens: ${EMS_RATE_LIMIT_REGISTRATION_TOKENS:1}
      general:
        replenish-rate: ${EMS_RATE_LIMIT_GENERAL_PER_SECOND:20}
        burst-capacity: ${EMS_RATE_LIMIT_GENERAL_BURST:40}
        requested-tokens: ${EMS_RATE_LIMIT_GENERAL_TOKENS:1}
      reports:
        replenish-rate: ${EMS_RATE_LIMIT_REPORTS_PER_SECOND:2}
        burst-capacity: ${EMS_RATE_LIMIT_REPORTS_BURST:4}
        requested-tokens: ${EMS_RATE_LIMIT_REPORTS_TOKENS:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    circuitbreakers:
      enabled: true


resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: ${EMS_GATEWAY_CB_WINDOW_SIZE:20}
        minimumNumberOfCalls: ${EMS_GATEWAY_CB_MIN_CALLS:5}
        permittedNumberOfCallsInHalfOpenState: ${EMS_GATEWAY_CB_HALF_OPEN_CALLS:3}
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: ${EMS_GATEWAY_CB_OPEN_WAIT:30s}
        failureRateThreshold: ${EMS_GATEWAY_CB_FAILURE_THRESHOLD:50}
        slowCallRateThreshold: ${EMS_GATEWAY_CB_SLOW_CALL_THRESHOLD:50}
        slowCallDurationThreshold: ${EMS_GATEWAY_CB_SLOW_CALL_DURATION:3s}
    instances:
      emsAuthApiCircuitBreaker:
        baseConfig: default
      emsEmployeesApiCircuitBreaker:
        baseConfig: default
      emsDepartmentsApiCircuitBreaker:
        baseConfig: default
      emsAttendanceApiCircuitBreaker:
        baseConfig: default
      emsLeavesApiCircuitBreaker:
        baseConfig: default
      emsPayrollApiCircuitBreaker:
        baseConfig: default
      emsPayslipsApiCircuitBreaker:
        baseConfig: default
      emsReportsApiCircuitBreaker:
        baseConfig: default
      emsPerformanceApiCircuitBreaker:
        baseConfig: default
      emsAnnouncementsApiCircuitBreaker:
        baseConfig: default
      emsNotificationsApiCircuitBreaker:
        baseConfig: default
      emsDashboardApiCircuitBreaker:
        baseConfig: default
      emsUsersApiCircuitBreaker:
        baseConfig: default
      emsSelfServiceApiCircuitBreaker:
        baseConfig: default
      emsSystemLogsApiCircuitBreaker:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: ${EMS_GATEWAY_TIME_LIMITER_TIMEOUT:5s}
        cancelRunningFuture: true
    instances:
      emsAuthApiCircuitBreaker:
        baseConfig: default
      emsEmployeesApiCircuitBreaker:
        baseConfig: default
      emsDepartmentsApiCircuitBreaker:
        baseConfig: default
      emsAttendanceApiCircuitBreaker:
        baseConfig: default
      emsLeavesApiCircuitBreaker:
        baseConfig: default
      emsPayrollApiCircuitBreaker:
        baseConfig: default
      emsPayslipsApiCircuitBreaker:
        baseConfig: default
      emsReportsApiCircuitBreaker:
        baseConfig: default
      emsPerformanceApiCircuitBreaker:
        baseConfig: default
      emsAnnouncementsApiCircuitBreaker:
        baseConfig: default
      emsNotificationsApiCircuitBreaker:
        baseConfig: default
      emsDashboardApiCircuitBreaker:
        baseConfig: default
      emsUsersApiCircuitBreaker:
        baseConfig: default
      emsSelfServiceApiCircuitBreaker:
        baseConfig: default
      emsSystemLogsApiCircuitBreaker:
        baseConfig: default
