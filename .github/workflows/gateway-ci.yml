name: EMS Gateway CI

on:
  pull_request:
    branches: ["develop", "main"]
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-ci.yml"
      - "mvnw"
      - ".mvn/**"
  push:
    branches: ["develop"]
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-ci.yml"
      - "mvnw"
      - ".mvn/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ems-gateway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test gateway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Verify gateway
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          EMS_GATEWAY_REDIS_INTEGRATION_TESTS: "true"
        run: bash ./mvnw --batch-mode --no-transfer-progress -f gateway/pom.xml verify

      - name: Build gateway Docker image
        run: docker build --file gateway/Dockerfile --tag ems-api-gateway:ci .
